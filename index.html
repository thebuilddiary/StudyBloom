<!-- Planner -->
<section id="planner" class="dashboard-section">
  <h2>My Planner</h2>
  <p>Turn your study goals into organised sessions.</p>

  <div class="content-card">
    <h3>Plan a study session</h3>

    <form id="planner-form" class="planner-form">

      <label for="planner-subject">Subject</label>
      <select id="planner-subject" required>
        <option value="">Choose a subject</option>
        <option>English</option>
        <option>Psychology</option>
        <option>Political Science</option>
        <option>Legal Studies</option>
        <option>Artificial Intelligence</option>
        <option>Physics</option>
        <option>Chemistry</option>
        <option>Mathematics</option>
        <option>Biology</option>
        <option>Business Studies</option>
        <option>Economics</option>
        <option>Commercial Arts</option>
        <option>Entrepreneurship</option>
        <option>Physical Education</option>
        <option>Computer Science</option>
        <option>Yoga</option>
        <option>Other</option>
      </select>

      <label for="planner-topic">Chapter or topic</label>
      <input
        type="text"
        id="planner-topic"
        placeholder="e.g. Human Memory"
        required
      >

      <label for="planner-date">Study date</label>
      <input type="date" id="planner-date" required>

      <label for="planner-priority">Priority</label>
      <select id="planner-priority" required>
        <option value="High">High</option>
        <option value="Medium" selected>Medium</option>
        <option value="Low">Low</option>
      </select>

      <button type="submit">Add study session</button>

    </form>
  </div>

  <div class="content-card">
    <h3>Your planned sessions</h3>
    <div id="planner-list">
      <p class="empty-message">No study sessions planned yet.</p>
    </div>
  </div>
</section>
